name: Build unsigned IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build without code signing
        run: |
          xcodebuild \
            -project HelloWorld.xcodeproj \
            -target HelloWorld \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package into an IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/HelloWorld.app Payload/
          rm -rf Payload/HelloWorld.app/_CodeSignature
          zip -qry HelloWorld.ipa Payload

      # Deleted first so re-running the workflow for the same commit doesn't fail.
      - name: Publish commit release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$GITHUB_SHA" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$GITHUB_SHA" HelloWorld.ipa \
            --title "${GITHUB_SHA::7}" --notes "Built from $GITHUB_SHA" \
            --target "$GITHUB_SHA" --latest=false

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest HelloWorld.ipa \
            --title latest --notes "Latest build from $GITHUB_SHA" \
            --target "$GITHUB_SHA" --latest
